[metadata]
name = cryosage-recon
version = 0.1.0
description = Gaussian reconstruction of conformational and compositional cryo-EM heterogeneity
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files =
    LICENSE
    NOTICE

[options]
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    torch>=2.1
    torchvision>=0.16
    lightning>=2.2
    mmengine>=0.10
    numpy>=1.24,<2
    scipy>=1.10
    scikit-learn>=1.3
    pandas>=1.5
    matplotlib>=3.7
    umap-learn>=0.5
    einops>=0.7
    starfile>=0.5
    mrcfile>=1.4

[options.packages.find]
include = cryosage*

[options.entry_points]
console_scripts =
    cryosage-homo = cryosage.training.homo:train
    cryosage-hetero = cryosage.training.hetero:train
